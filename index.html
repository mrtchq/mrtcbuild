<script>
(function(){
  var styleId = 'mrtc-answerly-shadow-fix';
  var css = '[shadow="spotlight"] .h, [shadow="spotlight"] .ci { box-shadow: none !important; }' +
            'html, body { background: transparent !important; }';
  function patchFrame(frame) {
    function install() {
      frame.style.colorScheme = 'dark';
      frame.style.background = 'transparent';
      frame.style.boxShadow = 'none';
      try {
        var doc = frame.contentDocument;
        if (!doc || !doc.documentElement || doc.getElementById(styleId)) return;
        var style = doc.createElement('style');
        style.id = styleId;
        style.textContent = css;
        (doc.head || doc.documentElement).appendChild(style);
      } catch (_) {}
    }
    frame.addEventListener('load', install);
    install();
  }
  var observer;
  function findWidget() {
    var frames = document.querySelectorAll('iframe.cf[title="Widget"]');
    if (!frames.length) return false;
    frames.forEach(patchFrame);
    if (observer) observer.disconnect();
    return true;
  }
  if (!findWidget()) {
    observer = new MutationObserver(findWidget);
    observer.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
